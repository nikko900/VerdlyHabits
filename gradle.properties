# Gradle daemon — raise heap to avoid OutOfMemoryError during KSP/compile/dex
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Windows memory-maps .dex outputs; the file watcher then fails to overwrite them
# ("user-mapped section open" / KSP "Unable to delete file").
org.gradle.vfs.watch=false

# Kotlin compiler daemon (separate from Gradle; needs its own budget for large modules)
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m

# Avoid Gradle waiting forever on a stuck Kotlin daemon (IDE errors like
# "Waited 2 minutes for SettableFuture ... PENDING"). Runs the compiler inside
# the Gradle process instead of IPC to kotlin-daemon — slightly slower, more stable.
kotlin.compiler.execution.strategy=in-process

kotlin.code.style=official
# KSP + Room on AGP 9: keep legacy Kotlin source sets until KSP/Kotlin are upgraded.
android.disallowKotlinSourceSets=false
# Incremental KSP on Windows leaves stale Room *_Impl.java after a failed compile;
# javac then reports "cannot find symbol" for DAOs/entities that still exist.
ksp.incremental=false

# Point Gradle to Android Studio's bundled JBR (has jlink, jmod, etc.)
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio2\\jbr
